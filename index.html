<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

			const screen = document.getElementById('screen');
			const osd = document.getElementById('osd');
			const tube = document.getElementById('tube');
			const keypad = document.getElementById('keypad');
			const canvas = document.querySelector('.noise');
			const cx = canvas.getContext('2d');
			const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
			const wait = ms => new Promise(r => setTimeout(r, ms));
			const pad = n => String(n).padStart(2, '0');

			function drawNoise() {
				const img = cx.createImageData(canvas.width, canvas.height), d = img.data;
				for (let i = 0; i < d.length; i += 4) {
					const v = (Math.random() * 255) | 0;
					d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
				}
				cx.putImageData(img, 0, 0);
			}
			drawNoise();
			if (!reduce) {let last = 0; (function loop(t) {if (t - last > 66) {drawNoise(); last = t;} requestAnimationFrame(loop);})(0);}

			for (let n = 1; n <= 10; n++) {
				const b = document.createElement('button');
				b.className = 'key'; b.type = 'button'; b.textContent = n;
				b.setAttribute('aria-label', 'Channel ' + n);
				b.addEventListener('click', () => tune(n, b));
				keypad.appendChild(b);
			}

			const VALID = /^[A-Za-z0-9._-]+\.mp4$/;
			function setTube(url) {
				if (tube.getAttribute('src') === url) {tube.currentTime = 0;}
				else {tube.setAttribute('src', url); tube.load();}
				tube.play().catch(() => { });
			}

			let busy = false;
			async function tune(n, btn) {
				if (busy) return;
				busy = true;
				document.querySelectorAll('.key.on').forEach(k => k.classList.remove('on'));
				if (btn) btn.classList.add('on');

				screen.classList.add('switching');
				osd.textContent = 'CH ' + pad(n);
				try {
					const res = await fetch(`/api/channels/${n}/load`, {
						credentials: 'same-origin',
						/*headers: {
							'X-Channel-Id': n
						}*/
					});
					const url = (await res.text()).trim();
					await wait(reduce ? 0 : 300);
					if (VALID.test(url)) setTube(url);
				} catch (e) {
					osd.textContent = 'CH ' + pad(n) + ' — no signal';
				} finally {
					screen.classList.remove('switching');
					busy = false;
				}
			}

			document.getElementById('reportBtn').addEventListener('click', async () => {
				const btn = document.getElementById('reportBtn');
				btn.disabled = true;
				try {
					const channelId = osd.textContent.replace('CH', '').trim();
					const body = new URLSearchParams({ channelId });
					const res = await fetch('/api/report', {
						method: 'POST',
						credentials: 'same-origin',
						headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
						body: body.toString()
					});
					const data = await res.json();
					if (res.ok) {
						alert('Channel reported. We thank you for your feedback!');
					} else {
						alert(data.error || 'Report failed');
					}
				} catch (e) {
					alert('Report failed');
				} finally {
					setTimeout(() => { btn.disabled = false; alert('Report bad reception'); }, 3000);
				}
			});
    </script>
</body>
</html>
